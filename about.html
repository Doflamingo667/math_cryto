<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Math Train</title>
    <link rel="stylesheet" href="about.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <h1>Math Train</h1>
            </div>

            <nav class="nav-bar">
                <a id="home-link" href="index.html">Home</a>
                <a id="demo-link" href="demo.html">Demo</a>
                <a id="about-link" href="about.html">About us</a>
            </nav>
        </header>

        <main id="team-grid" class="team-grid"></main>
    </div>

<script>
    const team = [
        {
            name: "Vinchheang",
            dept: "Maths",
            img: "https://images.unsplash.com/photo-1635445397539-dec0f0c2715a?q=80&w=470&auto=format"
        },
        {
            name: "None",
            dept: "Maths",
            img: "https://images.unsplash.com/photo-1712866850677-67cf35b35e9f?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        },
        {
            name: "None",
            dept: "Maths",
            img: "https://images.unsplash.com/photo-1702404497705-0b50a1b42126?q=80&w=464&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        }
    ];

    const grid = document.getElementById('team-grid');

    // Generate cards dynamically
    team.forEach(member => {
        const card = `
            <div class="card">
                <div class="image-container">
                    <img src="${member.img}" alt="${member.name}">
                </div>
                <div class="info">
                    <h1>${member.name}</h1>
                    <p>${member.dept}</p>
                </div>
            </div>
        `;
        grid.innerHTML += card;
    });
</script>

</body>
</html>
